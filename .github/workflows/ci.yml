name: CI

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Format check
        id: format
        run: pnpm format:check
        continue-on-error: true

      - name: Type check
        id: typecheck
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
        continue-on-error: true

      - name: Build
        id: build
        run: pnpm build
        continue-on-error: true

      - name: Add CI result comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        with:
          script: |
            const marker = '<!-- ci-result-comment -->';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const lintOutcome = process.env.LINT_OUTCOME;
            const formatOutcome = process.env.FORMAT_OUTCOME;
            const typecheckOutcome = process.env.TYPECHECK_OUTCOME;
            const buildOutcome = process.env.BUILD_OUTCOME;

            const outcomes = [
              lintOutcome,
              formatOutcome,
              typecheckOutcome,
              buildOutcome,
            ];

            const allPassed = outcomes.every((outcome) => outcome === 'success');

            const summary = allPassed
              ? '✅ 모든 검증을 통과했습니다'
              : '❌ 일부 검증이 실패했습니다';

            const getMessage = (name, outcome) =>
              outcome === 'success'
                ? `- ${name}: 성공 ✅`
                : `- ${name}: 실패 ❌`;

            const body = [
              marker,
              '### CI 검증 결과',
              summary,
              '',
              getMessage('Lint', lintOutcome),
              getMessage('Format', formatOutcome),
              getMessage('Type Check', typecheckOutcome),
              getMessage('Build', buildOutcome),
              '',
              `[상세 로그 확인](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });

            const previousComment = comments.find((comment) => {
              return comment.user?.type === 'Bot' && comment.body?.includes(marker);
            });

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previousComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Check CI status
        if: steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
