<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#f8f9fa"/>
  <!-- 외벽 -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="#333" stroke-width="4"/>
  <!-- 중앙 복도 -->
  <line x1="40" y1="220" x2="760" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="40" y1="280" x2="760" y2="280" stroke="#333" stroke-width="2"/>
  <!-- 수직 칸막이 -->
  <line x1="200" y1="40" x2="200" y2="220" stroke="#555" stroke-width="2"/>
  <line x1="400" y1="40" x2="400" y2="220" stroke="#555" stroke-width="2"/>
  <line x1="600" y1="40" x2="600" y2="220" stroke="#555" stroke-width="2"/>
  <line x1="200" y1="280" x2="200" y2="460" stroke="#555" stroke-width="2"/>
  <line x1="500" y1="280" x2="500" y2="460" stroke="#555" stroke-width="2"/>
  <!-- 방 라벨 -->
  <text x="110" y="140" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">301호</text>
  <text x="300" y="140" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">302호</text>
  <text x="500" y="140" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">사무실</text>
  <text x="680" y="140" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">회의실</text>
  <text x="120" y="380" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">복도</text>
  <text x="350" y="380" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">라운지</text>
  <text x="630" y="380" font-family="sans-serif" font-size="14" fill="#666" text-anchor="middle">계단실</text>
  <!-- 복도 표시 -->
  <rect x="40" y="220" width="720" height="60" fill="#e9ecef" opacity="0.5"/>
  <text x="400" y="256" font-family="sans-serif" font-size="13" fill="#999" text-anchor="middle">복도</text>
  <!-- 문 표시 -->
  <line x1="150" y1="220" x2="170" y2="220" stroke="#fff" stroke-width="4"/>
  <line x1="350" y1="220" x2="370" y2="220" stroke="#fff" stroke-width="4"/>
  <line x1="550" y1="220" x2="570" y2="220" stroke="#fff" stroke-width="4"/>
  <line x1="150" y1="280" x2="170" y2="280" stroke="#fff" stroke-width="4"/>
  <line x1="420" y1="280" x2="440" y2="280" stroke="#fff" stroke-width="4"/>
</svg>
